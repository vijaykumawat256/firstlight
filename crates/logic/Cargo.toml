[package]
name = "firstlight-logic"
description = "The pure part of Firstlight's core: events, calendar files, time zones, the briefing. No files, no network, no database, so it also compiles to WebAssembly."
edition.workspace = true
version.workspace = true
publish = false

[features]
# Lets a database error turn into our error type with `?`. Off for the browser build.
rusqlite = ["dep:rusqlite"]

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
quick-xml = "0.42.0"
regex = "1.13.1"
rrule = "0.14.0"
rusqlite = { version = "0.42.0", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
getrandom = "0.4.3"
serde_json = "1.0.154"
thiserror = "2.0.21"

# In a browser, random numbers come from the page's crypto API.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.4.3", features = ["wasm_js"] }
