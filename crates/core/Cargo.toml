[package]
name = "daybrief-core"
description = "Platform-independent calendar logic. Must never depend on Tauri."
edition.workspace = true
version.workspace = true
publish = false

[dependencies]
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
getrandom = "0.4.3"
quick-xml = "0.42.0"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "form", "json", "rustls"] }
rrule = "0.14.0"
rusqlite = { version = "0.42.0", features = ["bundled-sqlcipher-vendored-openssl"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"

[dev-dependencies]
uuid = { version = "1.29.2", features = ["v4"] }
