[package]
name = "daybrief-core"
description = "Platform-independent calendar logic. Must never depend on Tauri."
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
getrandom = "0.4.3"
rusqlite = { version = "0.42.0", features = ["bundled-sqlcipher-vendored-openssl"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"

[dev-dependencies]
uuid = { version = "1.29.2", features = ["v4"] }
