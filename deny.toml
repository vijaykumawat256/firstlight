# cargo-deny policy. Run: cargo deny check
[graph]
# We ship macOS and Windows only; Linux-only transitive crates are not part of any build.
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-pc-windows-msvc"]

[advisories]
version = 2
yanked = "deny"
ignore = [
  # Reasons recorded so the ignores get revisited: each is a transitive dependency of Tauri that
  # `cargo tree` shows is not compiled for macOS or Windows. Re-check when Tauri updates.
  { id = "RUSTSEC-2024-0370", reason = "proc-macro-error unmaintained; build-time only, via Tauri" },
  { id = "RUSTSEC-2024-0429", reason = "glib unsound iterator; Linux (GTK) only" },
  { id = "RUSTSEC-2026-0370", reason = "zvariant unmaintained; D-Bus, Linux only" },
  { id = "RUSTSEC-2026-0371", reason = "zbus_names unmaintained; D-Bus, Linux only" },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive unmaintained; D-Bus, Linux only" },
]

[licenses]
version = 2
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC",
  "Unicode-3.0", "Zlib", "MPL-2.0", "CC0-1.0", "OpenSSL", "BSL-1.0", "0BSD", "Unlicense", "CDLA-Permissive-2.0",
  # sqlcipher-src: SQLite's public-domain "blessing" and the permissive WTFPL
  "blessing", "WTFPL",
]

[licenses.private]
# Our own crates are not published.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
