[package]
name = "daybrief"
version.workspace = true
edition.workspace = true
publish = false
description = "Firstlight desktop shell"

[lib]
name = "daybrief_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
daybrief-core = { path = "../crates/core" }
iana-time-zone = "0.1.65"
keyring = { version = "3", default-features = false, features = ["apple-native", "windows-native"] }
log = "0.4.35"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12.5", features = ["tray-icon", "macos-private-api", "image-png"] }
tauri-plugin-autostart = "2.7.0"
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-log = "2.10.2"
tauri-plugin-notification = "2.8.1"
tauri-plugin-opener = "2.7.3"
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-updater = { version = "2.14.1", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-event-kit = { version = "0.3", default-features = false, features = ["std", "block2", "EKEventStore", "EKEvent", "EKCalendar", "EKCalendarItem", "EKParticipant", "EKSource", "EKObject", "EKTypes"] }
objc2 = "0.6"
block2 = "0.6"
core-foundation = "0.10"
core-graphics = "0.25"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWorkspace", "NSResponder", "NSRunningApplication"] }
objc2-foundation = { version = "0.3", features = ["NSNotification", "NSString", "NSOperation", "NSDistributedNotificationCenter", "block2", "NSArray", "NSDate", "NSError", "NSPredicate", "NSTimeZone", "NSURL", "NSObject", "NSEnumerator", "NSSet", "NSValue", "NSAutoreleasePool"] }

[target."cfg(windows)".dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_RemoteDesktop", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[features]
# Built into release packages only: the updater needs a signing key and an update address (see docs/RELEASE.md).
updater = ["dep:tauri-plugin-updater"]
