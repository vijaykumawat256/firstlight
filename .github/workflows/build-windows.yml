name: Build Windows installer

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - run: npm ci
      - name: Build installer
        run: npm run tauri build -- --bundles nsis,msi
        env:
          # Optional OAuth client IDs (see docs/OAUTH_SETUP.md); add them as repository secrets.
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          MICROSOFT_OAUTH_CLIENT_ID: ${{ secrets.MICROSOFT_OAUTH_CLIENT_ID }}

      - uses: actions/upload-artifact@v4
        with:
          name: firstlight-windows
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
