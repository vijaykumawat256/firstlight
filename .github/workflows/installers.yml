name: Installers

# Builds the installers people actually install: an .exe for Windows and a .dmg for Mac. They are NOT signed
# (see docs/RELEASE.md), so Windows shows "unknown publisher" and macOS asks to be opened with right-click.
# Run it by hand (Actions tab, "Installers", Run workflow) or by pushing a tag such as v0.1.0. The finished
# files are attached to a release on the Releases page (and to the run as "artifacts").

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            bundles: nsis
            files: target/release/bundle/nsis/*.exe
          - os: macos-latest
            name: mac
            bundles: app,dmg
            files: target/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    env:
      # Baked into the app at build time (they identify the app; they are not passwords). Add them under
      # Settings, Secrets and variables, Actions. If they are missing the app still builds, and the Google and
      # Microsoft buttons say "Setup needed".
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      MICROSOFT_OAUTH_CLIENT_ID: ${{ secrets.MICROSOFT_OAUTH_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - name: Build the installer
        run: npm run tauri build -- --bundles ${{ matrix.bundles }}
        env:
          # "-" signs the Mac app with no certificate ("ad hoc"), so its seal is intact. Without it macOS can call
          # a downloaded copy "damaged". It is still not notarised: macOS asks to confirm the developer.
          APPLE_SIGNING_IDENTITY: ${{ matrix.os == 'macos-latest' && '-' || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: firstlight-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  # Puts both installers on the repository's Releases page, which doesn't expire like run artifacts do. A tag such as
  # v0.1.0 gives a release of that name; a run by hand gives a pre-release named after the run number.
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          IS_TAG: ${{ github.ref_type == 'tag' }}
          REF: ${{ github.ref_name }}
          RUN: ${{ github.run_number }}
          SHA: ${{ github.sha }}
        run: |
          ls -l dist
          if [ "$IS_TAG" = "true" ]; then tag="$REF"; extra=""; else tag="build-$RUN"; extra="--prerelease"; fi
          case "$tag" in *-*) extra="--prerelease" ;; esac
          gh release create "$tag" dist/* --repo "$REPO" --target "$SHA" --title "Firstlight $tag" $extra \
            --notes "Installers for Windows (.exe) and Mac (.dmg). Not signed yet: Windows may say \"unknown publisher\" (More info, Run anyway); on a Mac, right-click the app and choose Open the first time."
